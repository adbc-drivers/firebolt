# adbc.h is vendored from apache/arrow-adbc; no hook reformats it, so it stays
# diffable against upstream.
exclude: '^adbc\.h$'

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
  hooks:
    - id: ruff-check
      name: "ruff check (isort)"
      args: ["--select", "I", "--fix"]
    - id: ruff-check
      args: ["--fix"]
    - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    exclude: '^LICENSE\.txt$'

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--enforce-all"]
  - id: check-case-conflict
  - id: check-executables-have-shebangs
  - id: check-yaml
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: trailing-whitespace

- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: a9a8a861f30ed207ead7d5a3b7e8032283ba5da7  # frozen: v23.1.2
  hooks:
  - id: clang-format
    types_or: [c, c++]

- repo: https://github.com/koalaman/shellcheck-precommit
  rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d  # frozen: v0.11.0
  hooks:
  - id: shellcheck

- repo: https://github.com/adbc-drivers/dev
  rev: 167bd95aa679ff4f91e7e0eb8ae0bb453dc5f71a
  hooks:
  - id: rat
    language_version: python3.14  # adbc-drivers-dev requires it

# clang-tidy reads the generated Linux build's compile_commands.json and runs in
# the public adbc-drivers/dev image. It skips checkout-only pre-commit runs; the
# generated test workflow invokes it after compilation.
- repo: local
  hooks:
  - id: clang-tidy
    name: clang-tidy
    language: system
    types_or: [c, c++]
    entry: ./scripts/clang-tidy.sh
    require_serial: true
