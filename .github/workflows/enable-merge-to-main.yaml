---
name: enable-merge-to-main
on:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Every hook in .pre-commit-config.yaml except clang-tidy, which needs the
  # build's compile_commands.json and runs in build-and-test instead.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 3.14 for the rat hook: adbc-drivers-dev requires it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pre-commit
        run: pip install pre-commit

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        env:
          SKIP: clang-tidy
        run: pre-commit run --all-files --color=always --show-diff-on-failure

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: ./scripts/build.sh

      - name: clang-tidy
        run: ./scripts/clang-tidy.sh

      - name: Unit tests
        run: ./scripts/test-unit.sh

      - name: Integration tests
        run: ./scripts/test-integration.sh

      # The examples are the first code a new user runs, so a broken import or a
      # renamed driver-manager symbol has to fail the build.  --help exercises
      # every module-level import without needing an engine; the examples are
      # also run against a live engine manually before a release.
      #
      # Installed into a venv rather than the runner's system interpreter.
      # Ubuntu 24.04's Python is PEP 668 "externally managed", so a system-wide
      # `pip install` only works because the runner image happens to ship an
      # /etc/pip.conf with break-system-packages=true.  A venv does not depend on
      # that image detail, and does not mutate the interpreter other steps use.
      - name: Examples smoke check
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/examples-venv"
          "$RUNNER_TEMP/examples-venv/bin/pip" install --quiet adbc-driver-manager pyarrow
          for example in examples/python/*.py; do
            echo "--- $example"
            "$RUNNER_TEMP/examples-venv/bin/python" "$example" --help > /dev/null
          done

  merge-gate:
    name: Merge gate
    runs-on: ubuntu-24.04
    needs: [lint, build-and-test]
    if: ${{ always() }}
    steps:
      - name: Require lint and build-and-test success
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "lint: ${{ needs.lint.result }}, build-and-test: ${{ needs.build-and-test.result }}; blocking merge."
            exit 1
          fi
