---
# Publishes a GitHub release with a prebuilt libadbc_driver_firebolt.so per
# architecture, so consumers never have to clone the repo, initialise five
# submodules and run a Docker build just to run their first query.
#
# Trigger: push a tag matching v*, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must agree with `project(adbc_driver_firebolt VERSION ...)` in CMakeLists.txt;
# the `check-version` job fails the release if it does not.
#
# workflow_dispatch builds and uploads the artifacts without creating a
# release, so the pipeline can be exercised without cutting a version.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Tag matches CMake project version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with CMakeLists.txt
        run: |
          set -euo pipefail
          cmake_version="$(sed -n 's/^project(adbc_driver_firebolt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ -z "$cmake_version" ]; then
            echo "Could not parse the project version out of CMakeLists.txt" >&2
            exit 1
          fi
          echo "CMakeLists.txt version: $cmake_version"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "Not a tag build; skipping the equality check."
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Tag version: $tag_version"
          if [ "$tag_version" != "$cmake_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project(adbc_driver_firebolt VERSION $cmake_version)." >&2
            echo "Bump CMakeLists.txt and re-tag so the .so soname and ADBC_INFO_DRIVER_VERSION agree." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Same script CI and local development use: builds inside the pinned
      # Ubuntu 22.04 + clang-18 image so the .so works on older glibc too.
      - name: Build
        run: ./scripts/build.sh

      - name: Unit tests
        run: ./scripts/test-unit.sh

      # build/libadbc_driver_firebolt.so is a symlink into the versioned soname.
      # Ship a single flat, dereferenced file: driver managers are given an
      # explicit path, so the soname chain buys nothing on the consumer side.
      # It goes into a per-architecture archive rather than being renamed per
      # architecture, because a driver manager derives the entry point from the
      # file name (libadbc_driver_firebolt.so -> AdbcDriverFireboltInit).
      - name: Stage artifact
        run: |
          set -euo pipefail
          archive="adbc_driver_firebolt-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p staging dist
          cp -L build/libadbc_driver_firebolt.so staging/
          cp LICENSE.txt NOTICE.txt staging/
          tar -C staging -czf "dist/$archive" libadbc_driver_firebolt.so LICENSE.txt NOTICE.txt
          cp firebolt.toml dist/firebolt.toml
          cd dist
          sha256sum "$archive" > "$archive.sha256"
          ls -l

      # Fail loudly rather than shipping a .so that needs libraries the user
      # does not have. Only the C runtime and the dynamic loader are expected;
      # everything else is linked statically on purpose (see AGENTS.md).
      - name: Check runtime dependencies
        run: |
          set -euo pipefail
          needed="$(readelf -d staging/libadbc_driver_firebolt.so \
            | awk '/\(NEEDED\)/ { gsub(/[][]/, "", $5); print $5 }' | sort)"
          echo "DT_NEEDED:"
          echo "$needed"
          unexpected="$(echo "$needed" | grep -Ev '^(libc\.so\.6|libm\.so\.6|ld-linux-.*\.so\.[0-9]+)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected dynamic dependencies: $unexpected" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: adbc_driver_firebolt-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name 'adbc_driver_firebolt-linux-*' -exec cp {} dist/ \;
          # firebolt.toml is architecture-independent; both build jobs upload an
          # identical copy, so take whichever one landed first.
          find artifacts -type f -name 'firebolt.toml' -print -quit \
            | xargs -r -I{} cp {} dist/firebolt.toml
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt Firebolt ADBC driver for Linux.

          | File | Platform |
          |------|----------|
          | \`adbc_driver_firebolt-linux-x86_64.tar.gz\` | Linux x86_64 (glibc 2.34+) |
          | \`adbc_driver_firebolt-linux-aarch64.tar.gz\` | Linux aarch64 (glibc 2.34+) |
          | \`firebolt.toml\` | ADBC driver manifest (optional) |

          Each archive holds \`libadbc_driver_firebolt.so\`, \`LICENSE.txt\` and
          \`NOTICE.txt\`. Verify a download with the matching \`.sha256\` file, then see the
          [quickstart](https://github.com/adbc-drivers/firebolt#quickstart).

          This build reaches plaintext \`http://\` endpoints only — see
          [docs/authentication.md](https://github.com/adbc-drivers/firebolt/blob/main/docs/authentication.md)." \
            dist/*
