---
# FB2 only: runs tests/integration/tests/fb2_legacy_live against a real
# Firebolt 2.0 SaaS account.  Nightly rather than per PR, so an auto-stopped
# engine never blocks a merge.  Needs these repository secrets:
#   FIREBOLT_FB2_CLIENT_ID, FIREBOLT_FB2_CLIENT_SECRET, FIREBOLT_FB2_ACCOUNT,
#   FIREBOLT_FB2_ENGINE, FIREBOLT_FB2_ENVIRONMENT
# Each run creates its own adbc_test_<random> database and drops it at the end.
name: fb2-live-nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fb2-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: ./ci/scripts/build.sh test linux amd64

      - name: FB2 live suite
        env:
          FIREBOLT_FB2_CLIENT_ID: ${{ secrets.FIREBOLT_FB2_CLIENT_ID }}
          FIREBOLT_FB2_CLIENT_SECRET: ${{ secrets.FIREBOLT_FB2_CLIENT_SECRET }}
          FIREBOLT_FB2_ACCOUNT: ${{ secrets.FIREBOLT_FB2_ACCOUNT }}
          FIREBOLT_FB2_ENGINE: ${{ secrets.FIREBOLT_FB2_ENGINE }}
          FIREBOLT_FB2_ENVIRONMENT: ${{ secrets.FIREBOLT_FB2_ENVIRONMENT }}
        run: ./tests/integration/runner.py tests/fb2_legacy_live -rs

      # Every engine suite, pointed at the same 2.0 engine instead of the local one.
      - name: Full suite against FB2 SaaS
        if: ${{ always() }}
        env:
          FIREBOLT_TEST_TARGET: fb2
          FIREBOLT_FB2_CLIENT_ID: ${{ secrets.FIREBOLT_FB2_CLIENT_ID }}
          FIREBOLT_FB2_CLIENT_SECRET: ${{ secrets.FIREBOLT_FB2_CLIENT_SECRET }}
          FIREBOLT_FB2_ACCOUNT: ${{ secrets.FIREBOLT_FB2_ACCOUNT }}
          FIREBOLT_FB2_ENGINE: ${{ secrets.FIREBOLT_FB2_ENGINE }}
          FIREBOLT_FB2_ENVIRONMENT: ${{ secrets.FIREBOLT_FB2_ENVIRONMENT }}
        run: ./tests/integration/runner.py -rs
