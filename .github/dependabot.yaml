# Version updates only cover the manifests Dependabot can bump safely. The C++
# dependencies under submodule/ are pinned to release tags, and Dependabot's
# gitsubmodule ecosystem would move them to the tip of each default branch, so
# they are updated by hand. The builder image's Ubuntu 22.04 base is pinned for
# glibc portability and is left alone for the same reason.

version: 2
updates:
  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "chore: "
    directory: "/"
    groups:
      actions:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    commit-message:
      prefix: "chore(test): "
    directory: "/tests/integration/docker"
    groups:
      python:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
