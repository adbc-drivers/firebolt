name: firebolt
services:
  # The shared workflow waits for a service named test-service. Keep the
  # database and one-shot initialization separate so --wait covers both.
  test-service:
    image: alpine:3.23
    command: ["sleep", "infinity"]
    depends_on:
      firebolt:
        condition: service_healthy
      firebolt-init:
        condition: service_completed_successfully

  firebolt:
    image: ghcr.io/firebolt-db/engine:5.0.0-pre.0.20260927210425.e91cd5bd17f8
    # Firebolt Core uses io_uring. Its documented Docker invocation disables
    # the default seccomp profile and raises RLIMIT_MEMLOCK to 8 GiB so that
    # registered buffers can be pinned without ENOMEM:
    # https://github.com/firebolt-db/firebolt-core#readme
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: 8589934592
    healthcheck:
      # /ping becomes ready before the engine accepts queries, so exercise the
      # query endpoint with the CLI shipped in the image.
      test:
        - CMD
        - /usr/local/bin/firebolt
        - client
        - --endpoint
        - http://127.0.0.1:3473
        - --insecure
        - --quiet
        - --command
        - SELECT 1
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 10s
    ports:
      - "3473:3473"

  firebolt-init:
    image: ghcr.io/firebolt-db/engine:5.0.0-pre.0.20260927210425.e91cd5bd17f8
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        endpoint="http://firebolt:3473"
        firebolt client --endpoint "$${endpoint}" --insecure --quiet --command \
          "CREATE SCHEMA IF NOT EXISTS firebolt_validation_secondary"
        firebolt client --endpoint "$${endpoint}" --insecure --quiet --command \
          "CREATE DATABASE IF NOT EXISTS firebolt_validation_secondary"
        firebolt client --endpoint "$${endpoint}" \
          --database firebolt_validation_secondary --insecure --quiet --command \
          "CREATE SCHEMA IF NOT EXISTS firebolt_validation_secondary"
    depends_on:
      firebolt:
        condition: service_healthy
